[project]
name = "meridian-context"
version = "0.1.0"
description = "Approval-gated operational memory for Indian logistics teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pydeck>=0.9.1",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.49.0",
]

[project.optional-dependencies]
live = [
    "fastapi>=0.141.1",
    "google-genai>=1.67,<3",
    "sounddevice>=0.5.6",
    "uvicorn>=0.52.4",
]
telegram = [
    "python-telegram-bot>=22,<23",
]

[dependency-groups]
dev = ["pytest>=8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
