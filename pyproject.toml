[project]
name = "meridian-context"
version = "0.1.0"
description = "Approval-gated operational memory for Indian logistics teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pydeck>=0.9.1",
    "streamlit>=1.49.0",
]

[dependency-groups]
dev = ["pytest>=8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
