<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meridian Live</title>
  <style>
    :root{color-scheme:dark;--ink:#f3f5f3;--muted:#8d9992;--lime:#c8ff3d;--blue:#7692ff;--panel:#121614}
    *{box-sizing:border-box}body{margin:0;background:#030504;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;min-height:100svh;overflow:hidden}
    main{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:24px;position:relative}.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;z-index:2}.brand-row{display:flex;align-items:center;gap:12px}.brand-icon{height:54px;width:auto}.brand{font-weight:750;letter-spacing:-.03em}.status{font:12px ui-monospace,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.stage{display:grid;place-items:center;position:relative}
    .orb{width:min(52vw,430px);aspect-ratio:1;border-radius:50%;position:relative;background:radial-gradient(circle at 38% 34%,#f4fbff 0 7%,#cbd6ff 22%,#7895ff 50%,#4053bd 73%,#17224f 100%);box-shadow:0 0 120px #7898ff55,inset -44px -38px 100px #101b5b99;transform:scale(.97);transition:filter .25s ease;animation:breathe 3.8s ease-in-out infinite}
    .orb:before,.orb:after{content:"";position:absolute;border-radius:48%;filter:blur(24px);mix-blend-mode:screen;animation:drift 7s ease-in-out infinite alternate}.orb:before{inset:13% 6% 45% 9%;background:#fff9;transform:rotate(-12deg)}.orb:after{inset:50% 12% 12% 38%;background:#788fff99;animation-delay:-2.5s}.orb.listening{filter:saturate(1.35) brightness(1.12);animation-duration:1.8s}.orb.speaking{animation:pulse .72s ease-in-out infinite alternate;filter:saturate(1.5)}
    .transcript{position:absolute;bottom:6%;width:min(640px,88vw);text-align:center;color:#d8ddda;min-height:48px;font-size:clamp(15px,2vw,19px);text-wrap:balance}.controls{display:flex;align-items:center;justify-content:center;gap:12px}.button{border:1px solid #3a423e;background:#171c19;color:var(--ink);min-height:52px;padding:0 22px;border-radius:999px;font-weight:650;font-size:16px;cursor:pointer}.button.primary{background:var(--ink);color:#0a0c0b;border-color:var(--ink)}.button:disabled{opacity:.45;cursor:not-allowed}.privacy{max-width:360px;text-align:right;color:var(--muted);font-size:12px}
    @keyframes breathe{50%{transform:scale(1.025)}}@keyframes drift{to{transform:translate(26px,32px) rotate(26deg) scale(1.15)}}@keyframes pulse{to{transform:scale(1.045);box-shadow:0 0 155px #7898ff77,inset -44px -38px 100px #101b5b99}}
    @media(max-width:680px){main{padding:18px}.top{align-items:flex-start}.privacy{display:none}.orb{width:min(78vw,350px)}.transcript{bottom:1%}.bottom{justify-content:center}.controls{width:100%}.button{flex:1}.status{max-width:150px;text-align:right}}
    @media(prefers-reduced-motion:reduce){.orb,.orb:before,.orb:after{animation:none}}
  </style>
</head>
<body>
<main>
  <div class="top"><div class="brand-row"><img class="brand-icon" src="https://koboyo.com/icons/svg/boom-microphone.svg" alt="Hand-drawn boom microphone"><div><div class="brand">◉ MERIDIAN LIVE</div><div class="status">Operational voice / tool grounded</div></div></div><div class="status" id="status">offline</div></div>
  <section class="stage"><div class="orb" id="orb" aria-hidden="true"></div><div class="transcript" id="transcript" aria-live="polite">Start a session, then speak in Hindi, Hinglish or English.</div></section>
  <div class="bottom"><div class="controls"><button class="button primary" id="start">Start session</button><button class="button" id="mute" disabled>Mute</button><button class="button" id="end" disabled>End</button></div><div class="privacy">Audio streams through your local Meridian backend. The model key never enters the browser.</div></div>
</main>
<script>
  const orb=document.getElementById('orb'),statusEl=document.getElementById('status'),transcript=document.getElementById('transcript');
  const startBtn=document.getElementById('start'),muteBtn=document.getElementById('mute'),endBtn=document.getElementById('end');
  let ws,ctx,stream,source,processor,muted=false,nextPlay=0,sources=[];
  const setStatus=(text,state='')=>{statusEl.textContent=text;orb.className='orb '+state};
  function downsample(input,inputRate,targetRate=16000){const ratio=inputRate/targetRate,length=Math.round(input.length/ratio),out=new Int16Array(length);for(let i=0;i<length;i++){const start=Math.floor(i*ratio),end=Math.min(input.length,Math.floor((i+1)*ratio));let sum=0;for(let j=start;j<end;j++)sum+=input[j];const sample=sum/Math.max(1,end-start);out[i]=Math.max(-1,Math.min(1,sample))*32767}return out.buffer}
  function playPCM(b64){const raw=atob(b64),pcm=new Int16Array(raw.length/2);for(let i=0;i<pcm.length;i++)pcm[i]=(raw.charCodeAt(i*2)|(raw.charCodeAt(i*2+1)<<8));const buffer=ctx.createBuffer(1,pcm.length,24000),channel=buffer.getChannelData(0);for(let i=0;i<pcm.length;i++)channel[i]=pcm[i]/32768;const node=ctx.createBufferSource();node.buffer=buffer;node.connect(ctx.destination);nextPlay=Math.max(ctx.currentTime+.03,nextPlay);node.start(nextPlay);nextPlay+=buffer.duration;sources.push(node);node.onended=()=>{sources=sources.filter(x=>x!==node);if(!sources.length)setStatus(muted?'muted':'listening','listening')}}
  function interrupt(){sources.forEach(node=>{try{node.stop()}catch(e){}});sources=[];nextPlay=ctx?ctx.currentTime:0;setStatus('listening','listening')}
  async function start(){let sessionError='';startBtn.disabled=true;setStatus('connecting');try{ctx=new AudioContext();stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true},video:false});ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.binaryType='arraybuffer';ws.onmessage=e=>{const msg=JSON.parse(e.data);if(msg.type==='ready'){setStatus('listening','listening');muteBtn.disabled=endBtn.disabled=false;transcript.textContent='I’m listening.'}if(msg.type==='audio'){setStatus('speaking','speaking');playPCM(msg.data)}if(msg.type==='user')transcript.textContent='You · '+msg.text;if(msg.type==='agent')transcript.textContent='Meridian · '+msg.text;if(msg.type==='tool')statusEl.textContent='checking '+msg.name.replaceAll('_',' ');if(msg.type==='interrupted')interrupt();if(msg.type==='error'){sessionError=msg.text;setStatus('error');transcript.textContent=msg.text}};ws.onclose=()=>stop(false,sessionError||'Connection closed.');await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(2048,1,1);processor.onaudioprocess=e=>{if(!muted&&ws.readyState===1)ws.send(downsample(e.inputBuffer.getChannelData(0),ctx.sampleRate))};source.connect(processor);processor.connect(ctx.destination)}catch(err){transcript.textContent=err.message;setStatus('permission / connection error');startBtn.disabled=false}}
  function stop(closeSocket=true,message='Session ended.'){if(processor)processor.disconnect();if(source)source.disconnect();if(stream)stream.getTracks().forEach(t=>t.stop());if(closeSocket&&ws)ws.close();interrupt();if(ctx)ctx.close();ctx=null;setStatus('offline');startBtn.disabled=false;muteBtn.disabled=endBtn.disabled=true;transcript.textContent=message}
  startBtn.onclick=start;endBtn.onclick=()=>stop();muteBtn.onclick=()=>{muted=!muted;muteBtn.textContent=muted?'Unmute':'Mute';setStatus(muted?'muted':'listening',muted?'':'listening')};
</script>
</body>
</html>
