<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Synchus Live</title>
  <style>
    :root{color-scheme:dark;--ink:#f4f3f1;--focus:#d5ff62}
    *{box-sizing:border-box}
    body{margin:0;background:#030404;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;min-height:100svh;overflow:hidden}
    main{min-height:100svh;display:grid;place-items:center;padding:24px;position:relative}
    .stage{display:grid;place-items:center;position:relative;width:100%;height:100svh}
    .orb{--scale:.985;appearance:none;border:1px solid #e8e7ff4a;padding:0;cursor:pointer;width:min(52vw,460px);aspect-ratio:1;border-radius:50%;position:relative;isolation:isolate;overflow:hidden;background:#6a68e6;box-shadow:0 0 0 1px #8ca5ff2b,0 30px 100px #5838d54a,0 0 150px #6389ff2d,inset 0 0 40px #fff5;transform:translateZ(0) scale(var(--scale));transition:box-shadow .22s ease,filter .22s ease;will-change:transform}
    .orb:focus-visible{outline:3px solid var(--focus);outline-offset:12px}
    .orb__surface{position:absolute;inset:-9%;border-radius:45%;overflow:hidden;background:radial-gradient(circle at 34% 27%,#fff 0 3%,#fae6ff 10%,transparent 27%),radial-gradient(circle at 65% 69%,#39c8ff 0,transparent 36%),linear-gradient(135deg,#ff8fc4 4%,#9976ff 44%,#366ee8 82%);filter:saturate(1.08) contrast(1.03);transform:translateZ(0);will-change:transform,filter}
    .orb__flow{position:absolute;border-radius:44% 56% 52% 48%/56% 41% 59% 44%;filter:blur(22px);mix-blend-mode:screen;will-change:transform,opacity}
    .orb__flow--coral{inset:-8% 31% 8% -21%;background:radial-gradient(ellipse at center,#ffb5d9 0 24%,#ff5eb3 55%,transparent 73%);opacity:.9}
    .orb__flow--cyan{inset:15% -25% -11% 25%;background:radial-gradient(ellipse at center,#74edff 0 18%,#4c8dff 53%,transparent 74%);opacity:.82}
    .orb__flow--violet{inset:-27% -2% 42% 25%;background:radial-gradient(ellipse at center,#c96dff 0 18%,#722ee8 54%,transparent 73%);opacity:.78}
    .orb__flow--light{inset:7% 37% 41% 5%;background:radial-gradient(ellipse at center,#fff 0 14%,#e9e9ffcc 33%,transparent 68%);filter:blur(12px);opacity:.9}
    .orb__grain{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 45%,#30218325 78%,#160f532e 100%),url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");mix-blend-mode:soft-light;opacity:.35;box-shadow:inset 18px 15px 28px #fff5,inset -22px -25px 42px #2a176d66}
    .orb.listening{filter:saturate(1.05) brightness(1.03)}
    .orb.speaking{box-shadow:0 0 0 1px #bcd0ff4a,0 34px 110px #713ee073,0 0 190px #6f98ff55,inset 0 0 46px #fff6}
    .transcript{position:absolute;bottom:7%;width:min(760px,88vw);text-align:center;color:#e5e3df;min-height:48px;font-size:clamp(15px,2vw,20px);line-height:1.5;text-wrap:balance}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:680px){main{padding:18px}.orb{width:min(78vw,380px)}.transcript{bottom:4%}}
    @media(prefers-reduced-motion:reduce){.orb,.orb__surface,.orb__flow{transition:none!important;transform:none!important}}
  </style>
</head>
<body>
<main>
  <section class="stage">
    <button class="orb" id="orb" aria-label="Start voice session">
      <span class="orb__surface" id="surface">
        <span class="orb__flow orb__flow--coral" id="coral"></span>
        <span class="orb__flow orb__flow--cyan" id="cyan"></span>
        <span class="orb__flow orb__flow--violet" id="violet"></span>
        <span class="orb__flow orb__flow--light" id="light"></span>
      </span>
      <span class="orb__grain"></span>
    </button>
    <div class="transcript" id="transcript" aria-live="polite">Press Space to start.</div>
    <div class="sr-only" id="status" aria-live="polite">offline</div>
  </section>
</main>
<script>
  const orb=document.getElementById('orb'),surface=document.getElementById('surface'),coral=document.getElementById('coral'),cyan=document.getElementById('cyan'),violet=document.getElementById('violet'),light=document.getElementById('light'),statusEl=document.getElementById('status'),transcript=document.getElementById('transcript');
  const toggleBtn=document.getElementById('orb');
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ws,ctx,stream,source,processor,analyser,frequencyData,motionFrame,lastFrame=0,phase=0,voiceLevel=0,nextPlay=0,sources=[],active=false,connecting=false;
  const setStatus=(text,state='')=>{statusEl.textContent=text;orb.className='orb '+state};
  const averageBand=(fromHz,toHz)=>{if(!analyser||!frequencyData||!ctx)return 0;const binHz=ctx.sampleRate/analyser.fftSize,start=Math.max(0,Math.floor(fromHz/binHz)),end=Math.min(frequencyData.length,Math.ceil(toHz/binHz));let sum=0;for(let i=start;i<end;i++)sum+=frequencyData[i];return end>start?sum/(end-start)/255:0};
  function animateOrb(now=0){if(!analyser)return;analyser.getByteFrequencyData(frequencyData);const low=averageBand(70,320),mid=averageBand(320,2100),high=averageBand(2100,7200);const target=Math.min(1,Math.max(0,(low*.5+mid*.38+high*.12-.035)*2.65));voiceLevel+=((target>voiceLevel?.28:.09)*(target-voiceLevel));const delta=Math.min(32,lastFrame?now-lastFrame:16);lastFrame=now;phase+=delta*(.00022+voiceLevel*.0024);const motion=reduceMotion?0:1;const energy=voiceLevel*motion;orb.style.setProperty('--scale',String(.985+energy*.055));surface.style.transform=`rotate(${Math.sin(phase*.53)*3+energy*7}deg) scale(${1.01+energy*.055})`;surface.style.filter=`saturate(${1.08+energy*.48}) contrast(${1.03+energy*.08}) brightness(${1+energy*.08})`;coral.style.transform=`translate3d(${Math.sin(phase)*22+energy*34}px,${Math.cos(phase*.73)*18-energy*19}px,0) rotate(${phase*24+energy*18}deg) scale(${1+energy*.18})`;cyan.style.transform=`translate3d(${Math.cos(phase*.81)*20-energy*27}px,${Math.sin(phase*1.08)*24+energy*14}px,0) rotate(${-phase*21-energy*14}deg) scale(${1+high*energy*.38})`;violet.style.transform=`translate3d(${Math.sin(phase*.61)*18+energy*16}px,${Math.cos(phase*.92)*19+energy*22}px,0) rotate(${phase*18}deg) scale(${1+mid*energy*.28})`;light.style.transform=`translate3d(${Math.cos(phase*.47)*15+low*energy*20}px,${Math.sin(phase*.58)*12-mid*energy*18}px,0) scale(${1+energy*.45})`;orb.classList.toggle('speaking',voiceLevel>.055&&sources.length>0);motionFrame=requestAnimationFrame(animateOrb)}
  function startOrbMotion(){cancelAnimationFrame(motionFrame);lastFrame=0;motionFrame=requestAnimationFrame(animateOrb)}
  function stopOrbMotion(){cancelAnimationFrame(motionFrame);motionFrame=0;analyser=null;frequencyData=null;voiceLevel=0;orb.style.setProperty('--scale','.985');orb.classList.remove('speaking')}
  function downsample(input,inputRate,targetRate=16000){const ratio=inputRate/targetRate,length=Math.round(input.length/ratio),out=new Int16Array(length);for(let i=0;i<length;i++){const start=Math.floor(i*ratio),end=Math.min(input.length,Math.floor((i+1)*ratio));let sum=0;for(let j=start;j<end;j++)sum+=input[j];const sample=sum/Math.max(1,end-start);out[i]=Math.max(-1,Math.min(1,sample))*32767}return out.buffer}
  function playPCM(b64){const raw=atob(b64),pcm=new Int16Array(raw.length/2);for(let i=0;i<pcm.length;i++)pcm[i]=(raw.charCodeAt(i*2)|(raw.charCodeAt(i*2+1)<<8));const buffer=ctx.createBuffer(1,pcm.length,24000),channel=buffer.getChannelData(0);for(let i=0;i<pcm.length;i++)channel[i]=pcm[i]/32768;const node=ctx.createBufferSource();node.buffer=buffer;node.connect(analyser);nextPlay=Math.max(ctx.currentTime+.03,nextPlay);node.start(nextPlay);nextPlay+=buffer.duration;sources.push(node);node.onended=()=>{sources=sources.filter(x=>x!==node);if(!sources.length)setStatus('listening','listening')}}
  function interrupt(){sources.forEach(node=>{try{node.stop()}catch(e){}});sources=[];nextPlay=ctx?ctx.currentTime:0;setStatus('listening','listening')}
  async function start(){if(active||connecting)return;let sessionError='';connecting=true;toggleBtn.setAttribute('aria-label','Connecting');setStatus('connecting');transcript.textContent='Connecting…';try{ctx=new AudioContext();analyser=ctx.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=.72;frequencyData=new Uint8Array(analyser.frequencyBinCount);analyser.connect(ctx.destination);startOrbMotion();stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true},video:false});ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.binaryType='arraybuffer';ws.onmessage=e=>{const msg=JSON.parse(e.data);if(msg.type==='ready'){active=true;connecting=false;toggleBtn.setAttribute('aria-label','End voice session');setStatus('listening','listening');transcript.textContent='I’m listening.'}if(msg.type==='audio'){setStatus('speaking','speaking');playPCM(msg.data)}if(msg.type==='user')transcript.textContent='You · '+msg.text;if(msg.type==='agent')transcript.textContent='Synchus · '+msg.text;if(msg.type==='tool')statusEl.textContent='checking '+msg.name.replaceAll('_',' ');if(msg.type==='interrupted')interrupt();if(msg.type==='error'){sessionError=msg.text;setStatus('error');transcript.textContent=msg.text}};ws.onclose=()=>stop(false,sessionError||'Connection closed.');await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(2048,1,1);processor.onaudioprocess=e=>{if(ws.readyState===1)ws.send(downsample(e.inputBuffer.getChannelData(0),ctx.sampleRate))};source.connect(processor);processor.connect(ctx.destination)}catch(err){connecting=false;stopOrbMotion();transcript.textContent=err.message;setStatus('permission / connection error');toggleBtn.setAttribute('aria-label','Start voice session')}}
  function stop(closeSocket=true,message='Press Space to start.'){active=false;connecting=false;if(processor)processor.disconnect();if(source)source.disconnect();if(stream)stream.getTracks().forEach(t=>t.stop());if(closeSocket&&ws)ws.close();interrupt();stopOrbMotion();if(ctx)ctx.close();ctx=null;setStatus('offline');toggleBtn.setAttribute('aria-label','Start voice session');transcript.textContent=message}
  function toggle(){if(active||connecting)stop();else start()}
  toggleBtn.onclick=toggle;
  window.addEventListener('keydown',event=>{if(event.code==='Space'&&!event.repeat){event.preventDefault();toggle()}});
  window.addEventListener('message',event=>{if(event.data?.type==='synchus-toggle-voice')toggle()});
</script>
</body>
</html>
